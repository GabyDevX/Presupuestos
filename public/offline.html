<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>Sin conexión · Presupuestos</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #0a0c10; color: #eceef2; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.5rem; color: #8c94a3; }
  button { min-height: 44px; padding: 0 1.5rem; border: 0; border-radius: 12px; background: #8fa3ff; color: #0a0c10; font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: light) { body { background: #f5f6f8; color: #101318; } p { color: #667085; } button { background: #4457e8; color: #fff; } }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>Presupuestos necesita internet para mostrar y guardar tus datos. Revisá tu conexión y volvé a intentar.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
